<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTs Miftahul Huda Kedokanbunder</title>
    <!-- Tailwind CSS for layout base -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cyberpunk Fonts from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #010308;
            color: #00ffcc;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CRT Scanline & Screen Vignette Overlay */
        .cyber-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
            background-size: 100% 4px, 100% 100%;
        }

        /* Subtle screen flicker */
        .flicker {
            animation: screenFlicker 0.15s infinite alternate;
        }

        @keyframes screenFlicker {
            0% { opacity: 0.97; }
            100% { opacity: 1; }
        }

        /* Glowing Cyber Canvas Container */
        #cyber-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glitch Text Effect */
        .glitch-wrapper {
            position: relative;
            z-index: 20;
            text-align: center;
            padding: 2rem;
            max-width: 1100px;
            width: 90%;
        }

        .glitch-text {
            font-family: 'Orbitron', 'Share Tech Mono', sans-serif;
            font-weight: 800;
            color: #00f0ff;
            text-shadow: 
                0 0 12px rgba(0, 240, 255, 0.9),
                0 0 25px rgba(0, 240, 255, 0.7),
                0 0 50px rgba(0, 240, 255, 0.5),
                0 0 100px rgba(255, 0, 128, 0.6);
            position: relative;
            letter-spacing: 2px;
            line-height: 1.4;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.8));
        }

        /* CSS Glitch pseudo elements */
        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .glitch-text::before {
            left: -2px;
            text-shadow: 2px 0 #ff0055;
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: 2px;
            text-shadow: -2px 0 #00ff66;
            animation: glitch-anim2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(20px, 9999px, 15px, 0); transform: skew(0.3deg); }
            10% { clip: rect(50px, 9999px, 80px, 0); transform: skew(0.8deg); }
            20% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.1deg); }
            30% { clip: rect(90px, 9999px, 10px, 0); transform: skew(0.5deg); }
            40% { clip: rect(35px, 9999px, 60px, 0); transform: skew(0.2deg); }
            50% { clip: rect(70px, 9999px, 40px, 0); transform: skew(0.6deg); }
            60% { clip: rect(5px, 9999px, 95px, 0); transform: skew(0.4deg); }
            70% { clip: rect(85px, 9999px, 20px, 0); transform: skew(0.9deg); }
            80% { clip: rect(40px, 9999px, 50px, 0); transform: skew(0.3deg); }
            90% { clip: rect(15px, 9999px, 75px, 0); transform: skew(0.7deg); }
            100% { clip: rect(60px, 9999px, 30px, 0); transform: skew(0.2deg); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(85px, 9999px, 10px, 0); transform: skew(0.4deg); }
            15% { clip: rect(15px, 9999px, 65px, 0); transform: skew(0.2deg); }
            30% { clip: rect(60px, 9999px, 25px, 0); transform: skew(0.7deg); }
            45% { clip: rect(30px, 9999px, 90px, 0); transform: skew(0.1deg); }
            60% { clip: rect(95px, 9999px, 40px, 0); transform: skew(0.8deg); }
            75% { clip: rect(45px, 9999px, 15px, 0); transform: skew(0.5deg); }
            90% { clip: rect(10px, 9999px, 80px, 0); transform: skew(0.3deg); }
            100% { clip: rect(70px, 9999px, 35px, 0); transform: skew(0.6deg); }
        }

        /* Glowing Border Cyber Frame */
        .cyber-border {
            border: 1px solid rgba(0, 240, 255, 0.6);
            background: rgba(1, 4, 12, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            box-shadow: 
                0 0 35px rgba(0, 240, 255, 0.35),
                0 0 70px rgba(255, 0, 127, 0.2),
                inset 0 0 25px rgba(0, 240, 255, 0.2);
            position: relative;
        }

        /* Decorative Cyber Corner Accents */
        .cyber-border::before,
        .cyber-border::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #ff007f;
            border-style: solid;
        }

        .cyber-border::before {
            top: -2px;
            left: -2px;
            border-width: 3px 0 0 3px;
            border-top-left-radius: 12px;
        }

        .cyber-border::after {
            bottom: -2px;
            right: -2px;
            border-width: 0 3px 3px 0;
            border-bottom-right-radius: 12px;
        }
    </style>
</head>
<body class="flicker">

    <!-- CRT Overlay for Cyberpunk Vibe -->
    <div class="cyber-overlay"></div>

    <!-- Dynamic Animated Hacker Canvas -->
    <canvas id="cyber-canvas"></canvas>

    <!-- Center Content Block -->
    <div class="glitch-wrapper">
        <div class="cyber-border p-6 md:p-12">
            <h1 class="glitch-text text-xl sm:text-2xl md:text-4xl lg:text-5xl" 
                data-text="Website MTs Miftahul Huda Kedokanbunder Dalam Tahap Pembangunan Fondasi">
                Website MTs Miftahul Huda Kedokanbunder Dalam Tahap Pembangunan Fondasi
            </h1>
            <div class="mt-6 pt-4 border-t border-cyan-500/30">
                <p class="text-cyan-300 text-xs sm:text-sm md:text-base tracking-widest uppercase font-mono [text-shadow:_0_0_12px_rgba(0,240,255,0.9)]">
                    Komplek KH. Ahmad Khudori Kedokan Bunder, Indramayu
                </p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');

        // Set Canvas dimensions full screen
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Matrix Rain Characters (Katakana, Numbers, Cyberpunk Symbols)
        const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ9876543210<>[]{}*+=#/\\';
        const fontSize = 11; // Font lebih kecil agar jumlah kolom hujan matriks lebih rapat dan banyak
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];
        let drops2 = []; // Layer kedua untuk memadatkan hujan matriks

        function initDrops() {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            drops2 = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * -100; // Random starting offsets
                drops2[i] = Math.random() * -150 - 50; // Offset tambahan untuk layer kedua
            }
        }
        initDrops();
        window.addEventListener('resize', initDrops);

        // Super Slow Motion Matrix Rain Parameters
        let frameCounter = 0;
        const dropSpeedDivider = 8; // Memperlambat pergerakan hujan matriks hingga 8x lipat (Slow Motion)

        // Grid & Particle System
        let gridOffset = 0;
        const particles = [];
        const particleCount = 70;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.5 + 1,
                speedX: (Math.random() - 0.5) * 0.12, // Gerak melayang partikel dalam slow motion
                speedY: (Math.random() - 0.5) * 0.12,
                color: Math.random() > 0.4 ? '#00f0ff' : '#ff007f'
            });
        }

        function drawMatrixRain() {
            // Deep void black background fade for glowing trail effect
            ctx.fillStyle = 'rgba(1, 3, 8, 0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Perspective Cyber Grid Lines with Neon Glow
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
            ctx.shadowColor = '#00f0ff';
            ctx.shadowBlur = 8;
            ctx.lineWidth = 1;
            
            const horizonY = canvas.height * 0.6;
            
            // Vertical Perspective Lines
            for (let x = -canvas.width; x < canvas.width * 2; x += 60) {
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, horizonY);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // Moving Horizontal Lines (Ultra Slow Motion)
            gridOffset = (gridOffset + 0.08) % 30;
            for (let y = horizonY; y < canvas.height; y += 15) {
                const drawY = y + gridOffset;
                if (drawY <= canvas.height) {
                    ctx.beginPath();
                    ctx.moveTo(0, drawY);
                    ctx.lineTo(canvas.width, drawY);
                    ctx.stroke();
                }
            }

            // Draw Hacker Digital Code Rain with Intense Glow-in-the-Dark Effects
            ctx.font = fontSize + 'px "Share Tech Mono", monospace';

            frameCounter++;
            const shouldUpdateDrops = (frameCounter % dropSpeedDivider === 0);

            // Helper function to render a matrix drop layer
            function renderDropLayer(dropArray, colorAccent) {
                for (let i = 0; i < dropArray.length; i++) {
                    const char = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                    const x = i * fontSize;
                    const y = dropArray[i] * fontSize;

                    // Leading glowing character (Intense glow white/neon green)
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#00ffcc';
                    ctx.shadowBlur = 18;
                    ctx.fillText(char, x, y);

                    // Body characters with vibrant glowing cyan/green and magenta accent
                    ctx.fillStyle = (i % 5 === 0) ? colorAccent : '#00ffaa';
                    ctx.shadowColor = (i % 5 === 0) ? colorAccent : '#00ffaa';
                    ctx.shadowBlur = 10;
                    ctx.fillText(char, x, y - fontSize);

                    // Update drop position at slow motion rate
                    if (shouldUpdateDrops) {
                        if (y > canvas.height && Math.random() > 0.985) {
                            dropArray[i] = 0;
                        } else {
                            dropArray[i]++;
                        }
                    }
                }
            }

            // Render layer 1 & layer 2 untuk menghasilkan efek hujan matriks yang sangat padat dan banyak
            renderDropLayer(drops, '#ff007f');
            renderDropLayer(drops2, '#00f0ff');

            // Draw Floating Neon Particles with Soft Glow
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.x += p.speedX;
                p.y += p.speedY;

                // Bounce off screen borders
                if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
            }
            ctx.shadowBlur = 0; // Reset shadow blur
        }

        // Main Animation Loop
        function animate() {
            drawMatrixRain();
            requestAnimationFrame(animate);
        }

        // Start animation on window load
        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
