<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTs Miftahul Huda Kedokanbunder</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Share Tech Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #030712;
            color: #00ffcc;
            overflow: hidden;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* CRT Scanline Overlay Effect */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.4) 50%,
                rgba(0, 0, 0, 0.4)
            );
            background-size: 100% 4px;
        }

        /* Vignette gradient */
        .vignette {
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(3, 7, 18, 0.85) 90%);
        }

        /* Neon Glow Effects */
        .neon-text-green {
            text-shadow: 0 0 5px #00ffcc, 0 0 15px #00ffcc, 0 0 30px #00ff88;
        }

        .neon-text-cyan {
            text-shadow: 0 0 5px #00e5ff, 0 0 15px #00e5ff, 0 0 35px #00a2ff;
        }

        .neon-box {
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3), inset 0 0 15px rgba(0, 255, 204, 0.15);
            border: 1px solid rgba(0, 255, 204, 0.5);
        }

        /* Glitch Animation */
        @keyframes glitch {
            0% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 2px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            60% {
                transform: translate(2px, 2px);
            }
            80% {
                transform: translate(2px, -2px);
            }
            100% {
                transform: translate(0);
            }
        }

        .glitch-effect:hover {
            animation: glitch 0.2s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        /* Cyberpunk Corner Accents */
        .cyber-corner-tl {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 12px;
            height: 12px;
            border-top: 3px solid #00ffcc;
            border-left: 3px solid #00ffcc;
        }

        .cyber-corner-tr {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            border-top: 3px solid #00ffcc;
            border-right: 3px solid #00ffcc;
        }

        .cyber-corner-bl {
            position: absolute;
            bottom: -2px;
            left: -2px;
            width: 12px;
            height: 12px;
            border-bottom: 3px solid #00ffcc;
            border-left: 3px solid #00ffcc;
        }

        .cyber-corner-br {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            border-bottom: 3px solid #00ffcc;
            border-right: 3px solid #00ffcc;
        }

        /* Pulsing cursor animation */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink {
            animation: blink 1s infinite;
        }
    </style>
</head>
<body class="relative min-h-screen w-full flex flex-col justify-between items-center p-4 md:p-8">

    <!-- Background Dynamic Canvas -->
    <canvas id="cyberCanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

    <!-- Overlay CRT Effects -->
    <div class="fixed inset-0 scanlines z-10 pointer-events-none"></div>
    <div class="fixed inset-0 vignette z-10 pointer-events-none"></div>

    <!-- Top Spacer for centering balance -->
    <div class="z-20 w-full h-4"></div>

    <!-- Main Content Container (Centered) -->
    <main class="z-20 max-w-4xl w-full my-auto text-center">
        <div class="relative bg-gray-950/80 backdrop-blur-md p-6 sm:p-10 md:p-14 rounded-lg neon-box glitch-effect transition-all duration-300">
            <!-- Cyberpunk Decorative Frame Corners -->
            <div class="cyber-corner-tl"></div>
            <div class="cyber-corner-tr"></div>
            <div class="cyber-corner-bl"></div>
            <div class="cyber-corner-br"></div>

            <!-- Glowing Cyber Heading Text -->
            <h1 class="font-orbitron text-2xl sm:text-4xl md:text-5xl font-black tracking-wide text-cyan-400 neon-text-cyan leading-tight sm:leading-snug">
                Website MTs Miftahul Huda Kedokanbunder Dalam Tahap Pembangunan Fondasi<span class="inline-block text-emerald-400 cursor-blink ml-1">_</span>
            </h1>
        </div>
    </main>

    <!-- Bottom Address Footer -->
    <footer class="z-20 w-full max-w-4xl text-center mt-6">
        <div class="relative bg-gray-950/60 backdrop-blur-sm py-3 px-6 rounded-md border border-emerald-500/30 inline-block max-w-full">
            <p class="font-orbitron text-xs sm:text-sm md:text-base text-emerald-400 tracking-wider neon-text-green font-semibold uppercase">
                Komplek KH Ahmad Khudori Kedokanbunder, Indramayu
            </p>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Resize listener
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initMatrix();
            initNodes();
        });

        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアカサタナハマヤラワガザダバパイキシチニヒミリヰギジヂビピウクスツヌフムユルグズブヅプエケセテネヘメレヱゲゼデベペオコソトノホモヨロヲゴゾドボポ';
        const fontSize = 14;
        let columns = Math.floor(width / fontSize);
        let drops = [];

        function initMatrix() {
            columns = Math.floor(width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                // Randomize initial dynamic vertical offset
                drops[i] = Math.floor(Math.random() * -100);
            }
        }
        initMatrix();

        const numNodes = 45;
        let nodes = [];
        let mouse = { x: width / 2, y: height / 2 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });

        function initNodes() {
            nodes = [];
            for (let i = 0; i < numNodes; i++) {
                nodes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2,
                    radius: Math.random() * 2 + 1.5
                });
            }
        }
        initNodes();

        function draw() {
            // Dark trail overlay for Matrix fade
            ctx.fillStyle = 'rgba(3, 7, 18, 0.18)';
            ctx.fillRect(0, 0, width, height);

            // --- 1. MATRIX RAIN DRAWING ---
            ctx.font = fontSize + 'px "Share Tech Mono", monospace';

            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                // Glowing green matrix head, darker green body
                if (Math.random() > 0.85) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#00ffcc';
                } else {
                    ctx.fillStyle = '#00ffaa';
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(char, x, y);

                // Reset drop to top once it passes screen bottom
                if (y > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }

            // --- 2. CYBER GRAPH GRID & CONNECTING NODES ---
            ctx.shadowBlur = 0; // reset shadow for lines
            for (let i = 0; i < nodes.length; i++) {
                let nodeA = nodes[i];

                // Update position
                nodeA.x += nodeA.vx;
                nodeA.y += nodeA.vy;

                // Bounce off canvas edges
                if (nodeA.x < 0 || nodeA.x > width) nodeA.vx *= -1;
                if (nodeA.y < 0 || nodeA.y > height) nodeA.vy *= -1;

                // Draw node point
                ctx.beginPath();
                ctx.arc(nodeA.x, nodeA.y, nodeA.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00e5ff';
                ctx.fill();

                // Connect nodes to near neighbors
                for (let j = i + 1; j < nodes.length; j++) {
                    let nodeB = nodes[j];
                    let dx = nodeA.x - nodeB.x;
                    let dy = nodeA.y - nodeB.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(nodeA.x, nodeA.y);
                        ctx.lineTo(nodeB.x, nodeB.y);
                        ctx.strokeStyle = `rgba(0, 229, 255, ${1 - dist / 130})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }

                // Interaction with mouse/touch cursor
                let mdx = nodeA.x - mouse.x;
                let mdy = nodeA.y - mouse.y;
                let mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                if (mdist < 150) {
                    ctx.beginPath();
                    ctx.moveTo(nodeA.x, nodeA.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.strokeStyle = `rgba(0, 255, 170, ${1 - mdist / 150})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            requestAnimationFrame(draw);
        }

        // Start animation loop on window load
        window.onload = function() {
            requestAnimationFrame(draw);
        };
    </script>
</body>
</html>
